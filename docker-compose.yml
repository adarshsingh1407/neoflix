# See DESIGN_DECISIONS.md for the reasoning behind every choice here
# (decision numbers referenced below). Copy .env.example to .env before
# running `docker compose up -d`.
#
# mem_limit values are ceilings (~2x measured idle usage), not reservations —
# see decision #16 for the numbers and the Docker Desktop VM sizing they assume.
#
# Services under the "extras" profile (Jellyseerr, Lifecycle, Homepage, Ofelia,
# Uptime Kuma) are off by default to fit the 2.5 GB VM. Start them on demand:
#   docker compose --profile extras up -d            (all of them)
#   docker compose up -d homepage                    (just one)

networks:
  neoflix-net:
    name: neoflix-net
    enable_ipv6: true

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    mem_limit: 1536m
    networks:
      - neoflix-net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/config/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media:ro
    ports:
      - "8096:8096"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    mem_limit: 384m
    networks:
      - neoflix-net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/config/prowlarr:/config
    ports:
      - "9696:9696"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    mem_limit: 384m
    networks:
      - neoflix-net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/config/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "7878:7878"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    mem_limit: 384m
    networks:
      - neoflix-net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/config/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8989:8989"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - neoflix-net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - ${DATA_ROOT}/config/qbittorrent:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    profiles: ["extras"]
    init: true
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - neoflix-net
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/config/jellyseerr:/app/config
    ports:
      - "5055:5055"
    depends_on:
      - jellyfin
      - radarr
      - sonarr

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - neoflix-net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/config/bazarr:/config
      - ${DATA_ROOT}/media:/data/media
    ports:
      - "6767:6767"
    depends_on:
      - radarr
      - sonarr

  lifecycle:
    build: ./scripts/lifecycle
    container_name: lifecycle
    profiles: ["extras"]
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - neoflix-net
    environment:
      - JELLYSEERR_URL=http://jellyseerr:5055
      - RADARR_URL=http://radarr:7878
      - SONARR_URL=http://sonarr:8989
      - JELLYSEERR_API_KEY=${JELLYSEERR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
    volumes:
      # Written on the host by scripts/host/lan-ip.sh (served at /host).
      # A folder, not a single-file mount, so the script's atomic rename
      # shows up inside the container.
      - ${DATA_ROOT}/config/host:/host:ro
    ports:
      - "8100:8100"
    depends_on:
      - jellyseerr
      - radarr
      - sonarr

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    profiles: ["extras"]
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - neoflix-net
    environment:
      # Homepage rejects requests whose Host header it doesn't know; default
      # only allows :3000.
      - HOMEPAGE_ALLOWED_HOSTS=localhost:3002,127.0.0.1:3002
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/config/homepage:/app/config
      - ${DATA_ROOT}/config/homepage/images:/app/public/images
    ports:
      # 3002 on the host: port 3000 is the host dashboard (decision #17).
      - "3002:3000"

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    profiles: ["extras"]
    command: daemon --docker
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - neoflix-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - homepage
      - jellyfin
    labels:
      ofelia.job-run.rotate-background.schedule: "@every 1h"
      ofelia.job-run.rotate-background.image: "docker:cli"
      ofelia.job-run.rotate-background.network: "neoflix-net"
      ofelia.job-run.rotate-background.command: "/bin/sh /scripts/rotate-background.sh"
      ofelia.job-run.rotate-background.environment: '["JELLYFIN_URL=http://jellyfin:8096", "JELLYFIN_API_KEY=${JELLYFIN_API_KEY}"]'
      ofelia.job-run.rotate-background.volume: '["/var/run/docker.sock:/var/run/docker.sock", "${NEOFLIX_REPO_ROOT}/scripts/ofelia:/scripts:ro", "${DATA_ROOT}/config/homepage/images:/images"]'
      ofelia.job-run.poster-grid.schedule: "0 4 * * *"
      ofelia.job-run.poster-grid.image: "alpine:latest"
      ofelia.job-run.poster-grid.network: "neoflix-net"
      ofelia.job-run.poster-grid.command: "/bin/sh /scripts/poster-grid.sh"
      ofelia.job-run.poster-grid.environment: '["JELLYFIN_URL=http://jellyfin:8096", "JELLYFIN_API_KEY=${JELLYFIN_API_KEY}"]'
      ofelia.job-run.poster-grid.volume: '["${NEOFLIX_REPO_ROOT}/scripts/ofelia:/scripts:ro"]'

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9
    container_name: uptime-kuma
    profiles: ["extras"]
    restart: unless-stopped
    mem_limit: 384m
    networks:
      - neoflix-net
    volumes:
      - ${DATA_ROOT}/config/uptime-kuma:/app/data
    ports:
      - "3001:3001"

